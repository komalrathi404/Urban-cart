</head>
<script>
  const hamburgerBtn = document.getElementById("hamburgerBtn");
  const navLinks = document.getElementById("navLinks");
  if (hamburgerBtn) {
    hamburgerBtn.addEventListener("click", function () {
      navLinks.classList.toggle("show");
    });
  }

  function initScrollReveal() {
    const reveals = document.querySelectorAll(".reveal:not(.visible)");
    const obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) entry.target.classList.add("visible");
      });
    }, { threshold: 0.1 });
    reveals.forEach(function (el) { obs.observe(el); });
  }
  initScrollReveal();
</script>
<body>
<a href="#mainContent" class="skip-link">Skip to main content</a>
<nav id="navbar">
  <div class="nav-logo">Urban <span>Cart</span></div>
  <button id="hamburgerBtn" class="hamburger-btn" aria-label="Toggle menu">☰</button>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li>
      <a href="cart.html" class="cart-icon-wrap" aria-label="View shopping cart">
  🛒
  <span id="cartBadge" class="cart-badge">0</span>
</a>
    </li>
  </ul>
</nav>

<header class="hero" style="min-height:30vh; padding-top:130px;">
  <h1>Your Cart</h1>
</header>

<main id="mainContent">
  <div id="cartContent"></div>
</main>

<footer><p>&copy; 2026 Urban Cart — Built for ApexPlanet Software Web Development Internship, Task 5</p></footer>

<script src="products.js"></script>
<script src="cart.js"></script>
<script>
  function renderCart() {
    const cart = getCart();
    const cartContent = document.getElementById("cartContent");

    if (cart.length === 0) {
      cartContent.innerHTML =
        '<div class="empty-cart">' +
          '<p style="font-size:3rem;">🛒</p>' +
          '<h3>Your cart is empty</h3>' +
          '<p style="margin:10px 0 20px;">Looks like you haven\'t added anything yet.</p>' +
          '<a href="shop.html" class="btn-primary">Continue Shopping</a>' +
        '</div>';
      return;
    }

    let itemsHtml = '<div class="cart-items">';
    cart.forEach(function (item) {
      const product = getProductById(item.id);
      if (!product) return;
      itemsHtml +=
        '<div class="cart-item">' +
          '<img src="' + product.image + '" alt="' + product.name + '">' +
          '<div class="cart-item-info">' +
            '<h4>' + product.name + '</h4>' +
            '<p class="product-price">₹' + product.price + '</p>' +
          '</div>' +
          '<div class="qty-selector">' +
            '<button class="qty-btn decrease-cart" data-id="' + item.id + '">−</button>' +
            '<span>' + item.quantity + '</span>' +
            '<button class="qty-btn increase-cart" data-id="' + item.id + '">+</button>' +
          '</div>' +
          '<p class="cart-item-subtotal">₹' + (product.price * item.quantity) + '</p>' +
          '<button class="remove-btn" data-id="' + item.id + '">✕</button>' +
        '</div>';
    });
    itemsHtml += '</div>';

    const total = getCartTotal();
    itemsHtml +=
      '<div class="cart-summary">' +
        '<p>Subtotal</p>' +
        '<h3>₹' + total + '</h3>' +
        '<a href="checkout.html" class="btn-primary" style="width:100%; text-align:center; margin-top:14px;">Proceed to Checkout</a>' +
      '</div>';

    cartContent.innerHTML = itemsHtml;

    document.querySelectorAll(".increase-cart").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const id = parseInt(btn.getAttribute("data-id"));
        const cart = getCart();
        const item = cart.find(function (i) { return i.id === id; });
        updateQuantity(id, item.quantity + 1);
        renderCart();
      });
    });

    document.querySelectorAll(".decrease-cart").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const id = parseInt(btn.getAttribute("data-id"));
        const cart = getCart();
        const item = cart.find(function (i) { return i.id === id; });
        updateQuantity(id, item.quantity - 1);
        renderCart();
      });
    });

    document.querySelectorAll(".remove-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const id = parseInt(btn.getAttribute("data-id"));
        removeFromCart(id);
        renderCart();
      });
    });
  }

  renderCart();
</script>
</body>
</html>
