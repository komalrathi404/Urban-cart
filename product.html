<!DOCTYPE html>

<meta property="og:description" content="Shop electronics, fashion, home goods, and more — all in one place.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
<title>Product Details | Urban Cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<script>
  const hamburgerBtn = document.getElementById("hamburgerBtn");
  const navLinks = document.getElementById("navLinks");
  if (hamburgerBtn) {
    hamburgerBtn.addEventListener("click", function () {
      navLinks.classList.toggle("show");
    });
  }

  function initScrollReveal() {
    const reveals = document.querySelectorAll(".reveal:not(.visible)");
    const obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) entry.target.classList.add("visible");
      });
    }, { threshold: 0.1 });
    reveals.forEach(function (el) { obs.observe(el); });
  }
  initScrollReveal();
</script>
<body>
<a href="#mainContent" class="skip-link">Skip to main content</a>
<nav id="navbar">
  <div class="nav-logo">Urban <span>Cart</span></div>
  <button id="hamburgerBtn" class="hamburger-btn" aria-label="Toggle menu">☰</button>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li>
      <a href="cart.html" class="cart-icon-wrap" aria-label="View shopping cart">
  🛒
  <span id="cartBadge" class="cart-badge">0</span>
</a>
    </li>
  </ul>
</nav>

<<main id="mainContent" style="padding-top:130px;">
  <div id="productContainer" class="product-detail-wrap"></div>

  <div class="section-header" style="margin-top:60px;">
    <h2>You May Also Like</h2>
    <div class="divider"></div>
  </div>
  <div class="product-grid" id="relatedGrid"></div>
</main>

<footer><p>&copy; 2026 Urban Cart — Built for ApexPlanet Software Web Development Internship, Task 5</p></footer>

<script src="products.js"></script>
<script src="cart.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const productId = parseInt(params.get("id"));
  const product = getProductById(productId);
  const container = document.getElementById("productContainer");

  if (!product) {
    container.innerHTML = "<p style='text-align:center; padding:60px 0;'>Product not found. <a href='shop.html'>Back to Shop</a></p>";
  } else {
    container.innerHTML =
      '<div class="product-detail-image"><img src="' + product.image + '" alt="' + product.name + '"></div>' +
      '<div class="product-detail-info">' +
        '<p class="product-category">' + product.category + '</p>' +
        '<h1>' + product.name + '</h1>' +
        '<p class="product-rating" style="font-size:1rem;">⭐ ' + product.rating + ' rating</p>' +
        '<p class="product-detail-price">₹' + product.price + '</p>' +
        '<p class="product-detail-desc">' + product.description + '</p>' +
        '<div class="qty-selector">' +
          '<button id="decreaseQty" class="qty-btn">−</button>' +
          '<span id="qtyValue">1</span>' +
          '<button id="increaseQty" class="qty-btn">+</button>' +
        '</div>' +
        '<button id="addToCartDetail" class="btn-primary" style="margin-top:16px;">Add to Cart</button>' +
      '</div>';

    let quantity = 1;
    const qtyValue = document.getElementById("qtyValue");

    document.getElementById("increaseQty").addEventListener("click", function () {
      quantity++;
      qtyValue.textContent = quantity;
    });

    document.getElementById("decreaseQty").addEventListener("click", function () {
      if (quantity > 1) {
        quantity--;
        qtyValue.textContent = quantity;
      }
    });

    document.getElementById("addToCartDetail").addEventListener("click", function () {
      addToCart(product.id, quantity);
    });

    // Related products (same category, excluding current)
    const relatedGrid = document.getElementById("relatedGrid");
    const related = PRODUCTS.filter(function (p) {
      return p.category === product.category && p.id !== product.id;
    }).slice(0, 3);

    related.forEach(function (p) {
      const div = document.createElement("div");
      div.className = "product-card";
      div.innerHTML =
        '<a href="product.html?id=' + p.id + '"><img src="' + p.image + '" alt="' + p.name + '"></a>' +
        '<div class="product-card-body">' +
          '<p class="product-category">' + p.category + '</p>' +
          '<h3>' + p.name + '</h3>' +
          '<p class="product-price">₹' + p.price + '</p>' +
          '<a href="product.html?id=' + p.id + '" class="btn-outline">View</a>' +
        '</div>';
      relatedGrid.appendChild(div);
    });
  }
</script>
</body>
</html>
